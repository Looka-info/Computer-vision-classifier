project:
  name: "PlantVision"
  description: "Plant Leaf Disease Classifier with PyTorch and Transfer Learning"
  random_seed: 42

paths:
  raw_data_dir: "data/raw/PlantVillage"
  splits_dir: "data/splits"
  processed_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  model_comparison_path: "reports/model_comparison.csv"

dataset:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  supported_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".JPG"
    - ".JPEG"
    - ".PNG"

preprocessing:
  image_size: 224
  norm_mean: [0.485, 0.456, 0.406]
  norm_std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip_prob: 0.5
    rotation_degrees: 15
    color_jitter:
      brightness: 0.1
      contrast: 0.1
      saturation: 0.1
      hue: 0.02

baseline:
  model_name: "baseline_cnn"
  conv_channels: [32, 64, 128, 256]
  fc_hidden: 256
  dropout: 0.3
  epochs: 8
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"

transfer_learning:
  model_name: "resnet18_transfer"
  architecture: "resnet18"
  weights: "IMAGENET1K_V1"
  stage_a_epochs: 4    # Frozen backbone, train classifier head
  stage_b_epochs: 6    # Fine-tune layer4 with lower learning rate
  batch_size: 32
  stage_a_lr: 0.001
  stage_b_backbone_lr: 0.0001
  stage_b_classifier_lr: 0.0005
  weight_decay: 0.0001
  unfreeze_layers: ["layer4", "fc"]

training:
  num_workers: 2
  early_stopping_patience: 3
  checkpoint_selection_metric: "val_macro_f1"

benchmark:
  warmup_iterations: 15
  num_iterations: 50
  batch_sizes: [1, 16]

demo:
  default_model: "models/resnet18_transfer_best.pt"
  top_k: 3
